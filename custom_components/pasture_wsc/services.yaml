recalculate:
  name: Recalculate completed weather days
  description: Recompute 1–31 completed local days from retained inputs. Missing observations remain missing. Existing versions are preserved.
  fields:
    entry_id:
      name: Integration entry
      required: true
      selector:
        config_entry:
          integration: pasture_wsc
    start_date:
      name: First local date
      required: true
      selector:
        date:
    end_date:
      name: Last local date
      required: true
      selector:
        date:
start_new_growth_cycle:
  name: Confirm a new paddock growth cycle
  description: Archives the selected cycle. Requires explicit confirmation and the current cycle ID; repeated requests with the old ID are rejected. Prefer the paddock confirmation UI.
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: pasture_wsc
    paddock_id:
      required: true
      selector:
        text:
    start_date:
      required: true
      selector:
        date:
    expected_cycle_id:
      required: true
      selector:
        text:
    confirmed:
      required: true
      default: false
      selector:
        boolean:
