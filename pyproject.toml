[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pasture-wsc"
version = "0.1.0"
description = "Experimental FONSCH specification implementation, independent of Home Assistant"
requires-python = ">=3.12"
dependencies = ["tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest>=8", "voluptuous>=0.15"]

[tool.setuptools.packages.find]
include = ["pasture_wsc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
